seed: 0
amp: true
model:
  encoder: resnet50
  output_stride: 16
  pretrained: true
data:
  root: /home/ubuntu/data/S5Mars_data
  batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  scale_range:
  - 0.5
  - 2.0
  overfit: 0
optim:
  lr: 0.01
  head_lr_mult: 10.0
  momentum: 0.9
  weight_decay: 0.0001
  poly_power: 0.9
schedule:
  max_iters: 150000
  stop_iter: 2000
  eval_interval: 500
  save_interval: 500
  log_interval: 50
ssl:
  t_hard: 0.5
  t_soft: 0.9
  lambda_u: 2.0
  lambda_s: 1.0
  ema_max: 0.996
