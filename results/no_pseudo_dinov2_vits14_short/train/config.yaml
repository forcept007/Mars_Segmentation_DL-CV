seed: 0
amp: true
model:
  encoder: dinov2_vits14
  output_stride: 16
  pretrained: true
data:
  root: null
  batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  scale_range:
  - 0.5
  - 2.0
  overfit: 0
optim:
  lr: 5.0e-06
  head_lr_mult: 40
  momentum: 0.9
  weight_decay: 0.01
  poly_power: 0.9
  name: adamw
schedule:
  max_iters: 40000
  stop_iter: null
  eval_interval: 5000
  save_interval: 1000
  log_interval: 50
ssl:
  t_hard: 1.01
  t_soft: 0.9
  lambda_u: 2.0
  lambda_s: 0.0
  unsup_pixels: all_gt
  ema_max: 0.996
  strong_aug: sigma
  mix: cutmix
  sam_root: ~/data/sam_masks
  min_pixels: 260
  mask_sigma: 2
  object_transform:
    max_angle: 30.0
    scale_range:
    - 0.75
    - 1.25
    flip_p: 0.5
save_dir: runs/no_pseudo_dinov2_vits14_short
