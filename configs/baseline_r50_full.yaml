seed: 0
amp: true
model:
  encoder: resnet50
  output_stride: 16
  pretrained: true
data:
  root: null
  batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  scale_range: [0.5, 2.0]
  overfit: 0
optim:
  lr: 0.01
  head_lr_mult: 10.0
  momentum: 0.9
  weight_decay: 0.0001
  poly_power: 0.9
schedule:
  max_iters: 150000
  stop_iter: null
  eval_interval: 5000
  save_interval: 1000
  log_interval: 50
